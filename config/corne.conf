# =====================================================================
# corne.conf — nice!nano ZMK config
# Goals: reliable BLE, both-half battery reporting, sane sleep timing,
#        maximum host/OS compatibility
# =====================================================================

# ---------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# ---------------------------------------------------------------------
# Core radios — usually already enabled by the corne shield itself,
# left explicit here so this file is self-documenting
# ---------------------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ---------------------------------------------------------------------
# Battery — report BOTH halves to the host, not just the central
# ---------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Works around a known Windows bug where GATT battery-level
# notifications get dropped/garbled on split keyboards
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ---------------------------------------------------------------------
# Bluetooth — connection stability and profile count
# ---------------------------------------------------------------------
# Disables 2M PHY negotiation, which some hosts/dongles handle badly.
# This bundles the tweaks the ZMK devs plan to make default anyway.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# On a split central, this must be (profiles + 1): the extra slot is
# reserved for the link to the other half. This keeps the usual 5
# host profiles instead of quietly dropping to 4.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Optional: boost radio TX power for range/reliability, at the cost of
# battery life. Safe on the nRF52840 (nice!nano). Uncomment to use.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------------
# HID — pick the most broadly compatible report types
# ---------------------------------------------------------------------
# 6-key rollover (HKRO) instead of NKRO: NKRO can break some
# BIOS/UEFI/Bitlocker/FileVault screens. Flip to NKRO below only if
# you specifically need it and don't care about that edge case.
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Basic consumer usages instead of full: gives up a few exotic media
# keys but works correctly across more OSes/hosts.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# ---------------------------------------------------------------------
# Sleep — don't blank/disconnect almost instantly
# ---------------------------------------------------------------------
# Idle state just turns off the display/backlight; BLE stays connected
# and the board wakes instantly on keypress.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep actually disconnects BLE and drops to near-zero power,
# with a slightly slower wake. Default is 15 min; this pushes it to
# 1 hour so it doesn't nod off mid-session. Adjust freely (ms).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
